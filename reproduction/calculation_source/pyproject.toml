[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econtypes"
version = "1.0.0"
description = "Типология экономик муниципалитетов по атрибутированной динамической сети: госзаказ ЕИС × траты СберИндекса × статистика Росстата"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Гилязетдинова Елена Рубиновна" }, { name = "Давлетова Лиана Фаритовна" }]
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "pyarrow>=14", "scikit-learn>=1.4", "scipy>=1.11",
  "networkx>=3.2", "pyyaml>=6", "matplotlib>=3.8", "python-docx>=1.1", "sqlalchemy>=2.0", "shapely>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8"]

[project.scripts]
econtypes = "econtypes.cli:main"

[tool.setuptools]
packages = ["econtypes"]

[tool.setuptools.package-data]
econtypes = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
