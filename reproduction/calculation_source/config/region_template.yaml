# Шаблон для запуска модели на другом субъекте РФ.
# Скопируйте config/config.yaml в config/<регион>.yaml и замените в нём только разделы ниже.
# Всё остальное (признаки, сети, кластеризация, ICVI, индексы, правила рекомендаций, дашборд)
# от региона не зависит. Запуск: econtypes --config config/<регион>.yaml all
#
# Пример заполнен для Республики Татарстан; значения отмечены как ПРИМЕР — проверьте их по своим данным.

region:
  name: Республика Татарстан
  inn_code: "16"                       # код субъекта в ИНН (первые 2 цифры)
  capital: ГО Казань                   # ключ МО регионального центра в формате «ГО <город>» / «МР <район>»
  capital_inn_prefixes: []             # ПРИМЕР: коды инспекций ФНС районов центра (первые 4 цифры ИНН), если их несколько.
                                       # Можно оставить пустым: таблица «код → МО» строится по данным автоматически
  capital_name_regex: "КАЗАН"          # корень названия центра в наименованиях заказчиков (все падежи)
  manual_inn_prefixes: {}              # МО, которые не определить по названиям заказчиков (ЗАТО и т. п.)
  enclaves: {}                         # МО без дорожных расстояний СберИндекса: {МО: {neighbour: МР ..., km: 30}}
  orient_anchors:                      # 3–5 городов (широта, долгота), только для поворота «карты по дорогам»
    ГО Казань: [55.79, 49.12]
    ГО Набережные Челны: [55.74, 52.40]
    МР Альметьевский: [54.90, 52.30]
    МР Бугульминский: [54.54, 52.79]

data:
  # Федеральные источники — есть для всех регионов:
  eis_files:                           # реестр контрактов ЕИС (44-ФЗ) по заказчикам региона: econtypes add-eis папка 2023
    - data/raw/<регион>/eis_2023.parquet
    - data/raw/<регион>/eis_2024.parquet
  eis_holdout: {}                      # необязательно: закупки следующих лет для проверки
  consumption: data/raw/consumption.parquet          # набор СберИндекса — общий для всей России, менять не нужно
  connection: data/raw/connection.parquet            # то же
  market_access: data/raw/market_access.parquet      # то же
  sber_spending: data/raw/sber_mo_spending.parquet   # то же
  population: data/raw/<регион>/pop_2024.csv          # численность и доля горожан по МО (Росстат, ОКТМО)
  external:
    # Региональные источники — НЕОБЯЗАТЕЛЬНЫ. Нет файла — строка удаляется, признак пропускается.
    # demography_pdf: data/raw/<регион>/demography.pdf      # рождаемость, смертность, миграция (территориальный орган Росстата)
    # budget_laws: {2023: ..., 2024: ...}                    # дотации на выравнивание из закона о бюджете субъекта
    # areas_html: ...                                        # площади МО → плотность населения
    bdpmo_csv: data/raw/<регион>/bdpmo.csv                    # БД ПМО Росстата: зарплаты и занятость (есть для всех регионов)

viz:
  title: "Экономические типы муниципалитетов Татарстана"
  cluster_anchors: {}                  # на первом запуске пусто: типы получат автоматические имена
  macro_anchors: {}                    # («Тип 3: выше доля горожан, ниже рождаемость»); потом можно задать свои

geo:
  adm1_name: Tatarstan                 # название субъекта в geoBoundaries ADM1 (латиницей)
