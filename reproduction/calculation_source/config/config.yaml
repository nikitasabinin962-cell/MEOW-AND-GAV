# Конфигурация пайплайна «Экономическая структура МО Республики Башкортостан»
# Все гиперпараметры собраны здесь; код их не дублирует.

database:
  url: sqlite:///data/econtypes.db   # или postgresql+psycopg2://user:pass@host/db

region:                 # всё, что относится к конкретному субъекту; для другого региона — см. config/region_template.yaml
  name: Республика Башкортостан
  inn_code: "02"          # код субъекта в ИНН: по нему поставщик относится к «своим» или «другим регионам»
  capital: ГО Уфа         # региональный центр (доля госзаказа у поставщиков центра, исключение республиканских заказчиков)
  capital_inn_prefixes: ["0272", "0273", "0274", "0275", "0276", "0277", "0278"]  # инспекции ФНС районов центра
  capital_name_regex: "УФА|УФЫ|УФЕ|УФИМ"   # формы названия центра в наименованиях заказчиков
  manual_inn_prefixes: {"0279": "ГО Межгорье"}  # МО, которые не определить по названиям заказчиков (ЗАТО)
  enclaves:               # МО без дорожных расстояний СберИндекса: ставятся рядом с соседом на карте
    ГО Межгорье: {neighbour: МР Белорецкий, km: 40}
  mid_lat: 54.5           # средняя широта (масштаб долготы на карте; по умолчанию — средняя по ориентирам)
  orient_anchors:         # 3–5 городов (широта, долгота) — только для поворота «карты по дорогам»
    ГО Уфа: [54.73, 55.95]
    ГО Стерлитамак: [53.63, 55.95]
    ГО Нефтекамск: [56.09, 54.25]
    ГО Сибай: [52.72, 58.66]
    ГО Октябрьский: [54.48, 53.47]

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  outputs: outputs

data:
  eis_files:            # выгрузки реестра контрактов ЕИС (44-ФЗ), склеенные scripts/merge_eis.py
    - data/raw/eis_2023.parquet
    - data/raw/eis_2024.parquet
  eis_holdout:          # закупки вне периода обучения — внешняя проверка устойчивости типов
    "2025": data/raw/eis_2025.parquet
    "2026": data/raw/eis_2026.parquet
  consumption: data/raw/consumption.parquet        # набор хакатона СберИндекса (с territory_id)
  connection: data/raw/connection.parquet          # авто/ж-д расстояния между МО
  market_access: data/raw/market_access.parquet    # индекс доступности рынков
  sber_spending: data/raw/sber_mo_spending.parquet # открытая выгрузка с сайта (с названиями) — для сопоставления id↔название
  population: data/raw/pop_rb_2024.csv
  external:
    demography_pdf: data/raw/demography_rb_2023.pdf      # Башкортостанстат: демография по районам, 2023
    budget_laws:                                         # законы о бюджете РБ: дотации на выравнивание
      2023: data/raw/budget_law_rb_2023.docx
      2024: data/raw/budget_law_rb_2024.docx
    areas_html: data/raw/rb_atd_area.html       # площади МО («Мой Город», АТД РБ) → плотность населения
    bdpmo_csv: data/raw/bdpmo_rb_2023_2026.csv   # плоская выгрузка паспортов БД ПМО (все МО в одном файле)
    bdpmo_glob: data/raw/bdpmo/*   # паспорта МО из БД ПМО Росстата (экспорт в Word), по файлу на МО
    bdpmo_min_mo: 50               # подключать признаки занятости и зарплат, когда паспортов не меньше
  period_start: "2023-01-01"
  period_end: "2024-12-31"
  window: Q             # шаг динамической сети: Q — квартал, M — месяц
  # Заказчики-органы республиканского/федерального уровня, зарегистрированные в Уфе,
  # обслуживают всю республику; в признаки Уфы их не включаем.
  exclude_republican_customers_from_ufa: true

features:
  spending_categories: ["Продовольствие", "Здоровье", "Общественное питание", "Маркетплейсы", "Транспорт"]
  okpd2_groups:          # укрупнённые группы ОКПД2 (по первым двум цифрам кода)
    construction: ["41", "42", "43", "71"]
    health: ["21", "32", "86"]
    food: ["01", "10", "11"]
    utilities: ["35", "36", "37", "38"]
    fuel_transport: ["19", "29", "30", "45", "49"]
    it_office: ["26", "58", "62", "63", "17"]
  log_transform: [proc_pc, spend_total]
  scaler: robust          # robust | standard

network:
  knn: 8                  # число соседей при разреживании графов сходства
  dtw_window: 2           # окно Сакоэ–Чибы для DTW (мес.)
  max_lag: 3              # максимальный лаг для лаговой корреляции (мес.)
  flow_min_rub: 1000000    # порог потока закупок между МО для ребра
  alpha_attr: 0.5         # вес атрибутного сходства в совмещённой матрице (0..1)
  layer_weights:          # веса слоёв структуры в основной модели
    comovement: 0.35      # синхронность помесячных изменений трат
    lead_lag: 0.10        # лаговая корреляция (опережение)
    dtw: 0.15             # сходство формы рядов (DTW)
    procurement_flow: 0.40  # потоки госзаказа между МО
  # Расстояние по дорогам в основную модель НЕ входит: используется как отдельный слой для
  # сравнения и как внешняя проверка (территориальная связность кластеров).

clustering:
  k_range: [3, 4, 5, 6, 7, 8]
  k_final: null           # null — максимум нормированных ICVI среди решений с min_cluster_size
  methods: [kmeans_attr, ward_attr, gmm_attr, spectral_struct, louvain_struct, spectral_fused, louvain_fused]
  final_method: spectral_fused
  macro_k: 3              # крупный уровень типологии для интерпретации и проверки вложенности
  min_cluster_size: 7     # ≈10% МО: решения с более мелкими кластерами не выбираются (иначе типы из 2–5 МО)
  null_perms: 40          # число случайных перестановок для нормировки ICVI
  random_state: 42
  n_init: 50

dynamics:
  smoothing_beta: 0.5     # эволюционная кластеризация: доля матрицы предыдущего окна
  rolling_quarters: 4     # окно сглаживания признаков и потоков (кварталов)
  beta_grid: [0.0, 0.3, 0.5, 0.7, 0.9]   # анализ чувствительности: качество снимка vs гладкость
  bootstrap: 200          # бутстреп устойчивости кластеров

viz:
  authors: "Гилязетдинова Елена Рубиновна, Давлетова Лиана Фаритовна"
  macro_anchors:
    "ГО Уфа": "Урбанизированное и промышленное ядро"
    "МР Бурзянский": "Восточная и северная периферия"
    "МР Чекмагушевский": "Западный и центральный аграрный пояс"
  title: "Экономические типы муниципалитетов Башкортостана"
  # якорное МО → название типа (интерпретация профилей кластеров, см. отчёт)
  cluster_anchors:
    "ГО Уфа": "Города и промышленные центры"
    "МР Иглинский": "Пригородный пояс Уфы"
    "МР Бурзянский": "Горный юго-восток, связанный с соседними регионами"
    "МР Краснокамский": "Западные промышленные районы"
    "МР Татышлинский": "Северная аграрная периферия"
    "МР Абзелиловский": "Бюджетная сельская периферия с молодым населением"
    "МР Миякинский": "Стареющие аграрные районы центра и юго-запада"

geo:
  dir: data/geo
  adm1_name: Bashkortostan   # название субъекта в geoBoundaries ADM1 (латиницей)
  simplify: 0.004            # упрощение границ, градусы

report:                      # пороги правил рекомендаций (процентили индексов)
  low: 25
  high: 75
  very_high: 85
  anomaly_iqr: 2.0          # порог «аномалии»: отклонение от медианы типа в IQR региона
